# The unit tests on the hosts where they mean something (Linux and Windows
# open their bases through sqflite_common_ffi, as a real application does),
# and tool/device_check inside a real application on Linux, macOS and an iOS
# simulator, where the sqflite plugin and the real folders are used.
name: platforms

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.3

jobs:
  windows:
    name: Windows (unit tests)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

  linux:
    name: Linux (unit tests and desktop application)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib test bin example
      - run: flutter test
      - name: Desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev xvfb
      - name: Device check
        working-directory: tool/device_check
        run: |
          flutter create --platforms=linux --org dev.b012 --project-name device_check .
          rm -rf test
          xvfb-run -a flutter test integration_test -d linux

  macos:
    name: macOS (desktop application)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Device check
        working-directory: tool/device_check
        run: |
          flutter create --platforms=macos --org dev.b012 --project-name device_check .
          rm -rf test
          flutter test integration_test -d macos

  ios:
    name: iOS (simulator)
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Boot an iPhone simulator
        id: simulator
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          # An iPhone of the runtime the default Xcode builds for: a newer
          # runtime installed next to it would have no build destination.
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          echo "iphonesimulator SDK: $sdk"
          udid=$(xcrun simctl list devices available --json | SDK_MAJOR="${sdk%%.*}" python3 -c '
          import json, os, sys
          wanted = ".iOS-" + os.environ["SDK_MAJOR"] + "-"
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if ".iOS-" in r), reverse=True)
          for runtime in sorted(runtimes, key=lambda r: wanted not in r):
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      print(runtime, device["name"], file=sys.stderr)
                      sys.exit()
          ')
          test -n "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          flutter devices
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Device check
        working-directory: tool/device_check
        run: |
          flutter create --platforms=ios --org dev.b012 --project-name device_check .
          rm -rf test
          flutter test integration_test -d "${{ steps.simulator.outputs.udid }}"
