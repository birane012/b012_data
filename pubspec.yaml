name: b012_data
description: Spring Boot-inspired Flutter package with auto-generated SQLite CRUD for your entities, file helpers and optional encryption. Android, iOS, Linux, macOS, Windows, web.
version: 2.1.0
homepage: https://birane012.github.io
repository: https://github.com/birane012/b012_data.git

# Supported platforms
platforms:
  android:
  ios:
  linux:
  macos:
  windows:
  web:

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  cryptography: ^2.9.0
  path: ^1.9.0
  path_provider: ^2.1.6
  sqflite: ^2.4.5
  sqflite_common: ^2.5.14
  sqflite_common_ffi: ^2.4.5
  sqlite3: ^3.8.0
  web: ^1.1.0

dev_dependencies:
  flutter_lints: ">=1.0.0 <7.0.0"
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

# Engine used by this package's own tests: SQLite3MultipleCiphers, so that
# encryption is tested for real. An application that wants encryption puts
# the same lines in its own pubspec.yaml (user defines of a dependency are
# ignored).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
