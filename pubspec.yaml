name: b012_data
description: Spring Boot-inspired Flutter package with auto-generated SQLite CRUD for your entities, plus binary file helpers (images, audio, video). Android, iOS, Linux, macOS, Windows.
version: 2.0.3
homepage: https://birane012.github.io
repository: https://github.com/birane012/b012_data.git

# Supported platforms
platforms:
  android:
  ios:
  linux:
  macos:
  windows:
  web:

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  path: ^1.9.0
  path_provider: ^2.1.6
  sqflite: ^2.4.5
  sqflite_common: ^2.5.14
  sqflite_common_ffi: ^2.4.5
  sqlite3: ^3.8.0
  web: ^1.1.0

dev_dependencies:
  flutter_lints: ">=1.0.0 <7.0.0"
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
